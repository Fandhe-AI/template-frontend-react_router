# lefthook（https://lefthook.dev）の Git hooks 定義。
#
# `make setup`（または `pnpm exec lefthook install`）を実行したローカル環境でのみ発火する。
# CI 側の検査を代替するものではなく、ローカルでの早期検知が目的。
# `--no-verify` によるバイパスは行わない。
# フックの追加・変更時は .claude/rules/git-hooks.md の方針（時間予算・CI との役割分担）に従う。
# 型チェック・テスト・knip・syncpack・ビルド・全体 lint など重い処理や CI と重複する検査はフックに置かず、
# CI（.github/workflows/check-pr.yml・ci.yml）側に置く。

pre-commit:
  parallel: true
  jobs:
    - name: "biome check"
      glob: "{apps,packages}/**/*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      tags:
        - lint

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
