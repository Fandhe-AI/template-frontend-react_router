name: PR チェック

# ジョブ追加・変更時は .claude/rules/github-actions.md に従うこと。

# 発火条件の方針:
# - draft PR では実行しない（ready_for_review で実行される）。skipped は必須チェックでは成功扱い。
# - ドキュメント・エージェントスキルのみの変更では重いジョブ（lint 以降）をスキップする。
#   workflow 単位の paths は必須チェックが pending のまま残るため使わず、changes ジョブで判定する。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # 変更検知（コード以外のみの変更なら重いジョブをスキップする）
  # --------------------------------------------------
  changes:
    name: Detect changes
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Detect code changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # .agents/ と .claude/ は biome の対象外かつ pnpm workspace 外のため、重いジョブは検査しない。
          # ドキュメント・エージェントスキルのみなら code=false。API 失敗・空の場合は安全側（fail-closed）で true
          if ! files="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"; then
            echo "::warning::changed files could not be listed; running all jobs"
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs/|\.agents/|\.claude/|skills-lock\.json$)|\.md$'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------
  # 軽量チェック（セットアップ不要・全 PR 共通）
  # --------------------------------------------------
  reviewdog:
    name: Biome (reviewdog)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Run reviewdog with Biome
        uses: mongolyy/reviewdog-action-biome@aed0b35b89586ed70a61e9749f2edd69c89e16fd # v1.13.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_level: warning

  editorconfig:
    name: EditorConfig
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Run editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0

      - run: editorconfig-checker

  # --------------------------------------------------
  # コミットメッセージ検証（全 PR 共通）
  # --------------------------------------------------
  commitlint:
    name: Commitlint
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Validate PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # --------------------------------------------------
  # コード品質チェック（main ブランチ向け PR のみ）
  # --------------------------------------------------
  lint:
    name: Biome lint & format
    needs: changes
    if: github.base_ref == 'main' && github.event.pull_request.draft == false && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Run Biome check
        run: pnpm lint

  check-types:
    name: TypeScript type check
    needs: changes
    if: github.base_ref == 'main' && github.event.pull_request.draft == false && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Run type check
        run: pnpm check-types

  knip:
    name: Knip (unused code)
    needs: changes
    if: github.base_ref == 'main' && github.event.pull_request.draft == false && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Run Knip
        run: pnpm knip

  syncpack:
    name: Syncpack (dependency consistency)
    needs: changes
    if: github.base_ref == 'main' && github.event.pull_request.draft == false && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Check dependency version consistency
        run: pnpm package:lint

      - name: Check package.json formatting
        run: pnpm package:format

  test:
    name: Test
    needs: changes
    if: github.base_ref == 'main' && github.event.pull_request.draft == false && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Collect coverage reports
        if: always()
        run: pnpm --filter=vitest-app collect-coverage

      - name: Report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          json-summary-path: ./apps/vitest/coverage/coverage-summary.json
          json-final-path: ./apps/vitest/coverage/coverage-final.json
          file-coverage-mode: changes

  test-e2e:
    name: E2E Test (Playwright)
    needs: changes
    if: github.base_ref == 'main' && github.event.pull_request.draft == false && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Install Playwright browsers
        run: cd apps/playwright && pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

  storybook-build:
    name: Storybook build
    needs: changes
    if: github.base_ref == 'main' && github.event.pull_request.draft == false && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Build Storybook
        run: pnpm storybook:build

  # --------------------------------------------------
  # ビルド（品質チェックと並列実行・main ブランチ向け PR のみ）
  # --------------------------------------------------
  build:
    name: Build
    needs: changes
    if: github.base_ref == 'main' && github.event.pull_request.draft == false && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Build application
        uses: ./.github/actions/build-app
